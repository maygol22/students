<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فرم ثبت اطلاعات</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #0b1e3d, #16305c);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    direction: rtl;
  }
  .container {
    max-width: 480px;
    margin: 40px auto;
    background: #ffffff;
    padding: 32px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  h1 {
    font-size: 21px;
    text-align: center;
    margin-bottom: 6px;
    color: #0b1e3d;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #6b7a99;
    margin-bottom: 20px;
  }
  .field {
    margin-top: 16px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: bold;
    color: #16305c;
  }
  input {
    width: 100%;
    padding: 11px 12px;
    border: 1.5px solid #d7dce6;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #f8f9fc;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    outline: none;
    border-color: #1e3f7a;
    box-shadow: 0 0 0 3px rgba(30,63,122,0.15);
    background: #fff;
  }
  button {
    width: 100%;
    margin-top: 26px;
    padding: 13px;
    background: linear-gradient(135deg, #1e3f7a, #0b1e3d);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover {
    opacity: 0.9;
  }
  button:disabled {
    background: #a0a8ba;
    cursor: not-allowed;
  }
  .msg {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
  }
  .msg.success { color: #1e7a4c; }
  .msg.error { color: #c53030; }
  .note {
    font-size: 11.5px;
    color: #9aa4b8;
    text-align: center;
    margin-top: 22px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="container">
  <h1>فرم ثبت اطلاعات</h1>
  <div class="subtitle">لطفاً موارد زیر را با دقت تکمیل کنید</div>
  <form id="dataForm">
    <div class="field">
      <label for="firstName">نام</label>
      <input type="text" id="firstName" required>
    </div>

    <div class="field">
      <label for="lastName">نام خانوادگی</label>
      <input type="text" id="lastName" required>
    </div>

    <div class="field">
      <label for="nationalId">کد ملی</label>
      <input type="text" id="nationalId" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>
    </div>

    <div class="field">
      <label for="fatherName">نام پدر</label>
      <input type="text" id="fatherName" required>
    </div>

    <div class="field">
      <label for="birthDate">تاریخ تولد</label>
      <input type="text" id="birthDate" placeholder="مثال: 1370/05/12" required>
    </div>

    <div class="field">
      <label for="mobile">شماره موبایل</label>
      <input type="text" id="mobile" inputmode="numeric" pattern="[0-9]{11}" maxlength="11" placeholder="مثال: 09121234567" required>
    </div>

    <div class="field">
      <label for="postalCode">کد پستی</label>
      <input type="text" id="postalCode" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>
    </div>

    <div class="field">
      <label for="plaque">پلاک منزل</label>
      <input type="text" id="plaque" required>
    </div>

    <div class="field">
      <label for="address">آدرس</label>
      <input type="text" id="address" required>
    </div>

    <button type="submit" id="submitBtn">ثبت اطلاعات</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="note">اطلاعات شما به‌صورت محرمانه ذخیره می‌شود و در دسترس افراد دیگر قرار نمی‌گیرد.</div>
</div>

<script>
// آدرس Web App که از Google Apps Script دریافت می‌کنید را اینجا جایگزین کنید
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyDVeMbI6drqZoqpUaTjnEnQxcOH6vKl0hBte_kFl_7tfVP_D0TGIv8CiHFpL5odDBY/exec";

// همین مقدار باید دقیقاً در Code.gs هم (متغیر SECRET_TOKEN) قرار داده شود
const SECRET_TOKEN = "dDmSS7HNjSAMoVmnCF8zlKWvkB6ak3o0";

document.getElementById('dataForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  msg.textContent = '';
  msg.className = 'msg';

  const data = {
    token: SECRET_TOKEN,
    firstName: document.getElementById('firstName').value.trim(),
    lastName: document.getElementById('lastName').value.trim(),
    nationalId: document.getElementById('nationalId').value.trim(),
    fatherName: document.getElementById('fatherName').value.trim(),
    birthDate: document.getElementById('birthDate').value.trim(),
    mobile: document.getElementById('mobile').value.trim(),
    postalCode: document.getElementById('postalCode').value.trim(),
    plaque: document.getElementById('plaque').value.trim(),
    address: document.getElementById('address').value.trim()
  };

  btn.disabled = true;
  btn.textContent = 'در حال ارسال...';

  fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(result => {
    if (result.status === 'success') {
      msg.textContent = 'اطلاعات با موفقیت ثبت شد.';
      msg.className = 'msg success';
      document.getElementById('dataForm').reset();
    } else {
      throw new Error(result.message || 'خطای نامشخص');
    }
  })
  .catch(err => {
    msg.textContent = 'خطا در ثبت اطلاعات. لطفاً دوباره تلاش کنید.';
    msg.className = 'msg error';
    console.error(err);
  })
  .finally(() => {
    btn.disabled = false;
    btn.textContent = 'ثبت اطلاعات';
  });
});
</script>

</body>
</html>
