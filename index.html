<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فرم ثبت اطلاعات</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #0b1e3d, #16305c);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    direction: rtl;
  }
  .container {
    max-width: 480px;
    margin: 40px auto;
    background: #ffffff;
    padding: 32px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  h1 {
    font-size: 21px;
    text-align: center;
    margin-bottom: 6px;
    color: #0b1e3d;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #6b7a99;
    margin-bottom: 20px;
  }
  .field {
    margin-top: 16px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: bold;
    color: #16305c;
  }
  input {
    width: 100%;
    padding: 11px 12px;
    border: 1.5px solid #d7dce6;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #f8f9fc;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    outline: none;
    border-color: #1e3f7a;
    box-shadow: 0 0 0 3px rgba(30,63,122,0.15);
    background: #fff;
  }
  button {
    width: 100%;
    margin-top: 26px;
    padding: 13px;
    background: linear-gradient(135deg, #1e3f7a, #0b1e3d);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover {
    opacity: 0.9;
  }
  button:disabled {
    background: #a0a8ba;
    cursor: not-allowed;
  }
  .msg {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
  }
  .msg.success { color: #1e7a4c; }
  .msg.error { color: #c53030; }
  .file-hint {
    font-size: 11px;
    color: #8a93a8;
    margin-top: 4px;
  }
  .file-name {
    font-size: 12px;
    color: #1e3f7a;
    margin-top: 4px;
    font-weight: bold;
  }
  .note {
    font-size: 11.5px;
    color: #9aa4b8;
    text-align: center;
    margin-top: 22px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="container">
  <h1>فرم ثبت اطلاعات</h1>
  <div class="subtitle">لطفاً موارد زیر را با دقت تکمیل کنید</div>
  <form id="dataForm"></form>
  <div class="note">اطلاعات شما به‌صورت محرمانه ذخیره می‌شود و در دسترس افراد دیگر قرار نمی‌گیرد.</div>
</div>

<script>
/* ==========================================================
   تنظیمات فرم — فیلدها را از همین لیست اضافه یا کم کنید
   ==========================================================
   هر فیلد یک آبجکت با این ویژگی‌هاست:
   - id:          شناسه‌ی یکتای فیلد (فقط حروف انگلیسی، بدون فاصله)
   - label:       برچسبی که کاربر می‌بیند
   - type:        نوع ورودی: "text" ، "numeric" (برای اعداد) یا "file" (برای آپلود عکس/مدرک)
   - required:    آیا پر کردنش اجباریه؟ (true / false)
   - placeholder: (اختیاری) متن راهنما داخل فیلد (فقط برای text/numeric)
   - maxLength:   (اختیاری) حداکثر تعداد کاراکتر (فقط برای text/numeric)
   - pattern:     (اختیاری) الگوی اعتبارسنجی regex (فقط برای text/numeric)

   نکته مهم: هر فیلدی که اینجا اضافه/حذف کنید، باید دقیقاً با
   همین id در آرایه‌ی FIELDS داخل فایل Code.gs هم اضافه/حذف بشه،
   تا ستون‌های شیت گوگل هم به‌درستی هماهنگ بمونن.
   ========================================================== */
const FIELDS = [
  { id: 'firstName',  label: 'نام',            type: 'text',    required: true },
  { id: 'lastName',   label: 'نام خانوادگی',    type: 'text',    required: true },
  { id: 'nationalId', label: 'کد ملی',          type: 'numeric', required: true, maxLength: 10, pattern: '[0-9]{10}' },
  { id: 'fatherName', label: 'نام پدر',          type: 'text',    required: true },
  { id: 'birthDate',  label: 'تاریخ تولد',       type: 'text',    required: true, placeholder: 'مثال: 1370/05/12' },
  { id: 'mobile',     label: 'شماره موبایل',     type: 'numeric', required: true, maxLength: 11, pattern: '[0-9]{11}', placeholder: 'مثال: 09121234567' },
  { id: 'postalCode', label: 'کد پستی',          type: 'numeric', required: true, maxLength: 10, pattern: '[0-9]{10}' },
  { id: 'plaque',     label: 'پلاک منزل',        type: 'text',    required: true },
  { id: 'address',    label: 'آدرس',            type: 'text',    required: true },
  { id: 'nationalCardImage', label: 'تصویر کارت ملی',  type: 'file', required: true },
  { id: 'birthCertImage',    label: 'تصویر شناسنامه',   type: 'file', required: true },
];

// حداکثر حجم مجاز برای هر فایل آپلودی (بر حسب مگابایت)
const MAX_FILE_SIZE_MB = 5;

// آدرس Web App که از Google Apps Script دریافت می‌کنید را اینجا جایگزین کنید
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJm_Eatnx95nxHC3_RF65O8DtBGAzwpQXHBrpufO293HASkLAGEGJX1BHUhNok/exec";

// همین مقدار باید دقیقاً در Code.gs هم (متغیر SECRET_TOKEN) قرار داده شود
const SECRET_TOKEN = "dDmSS7HNjSAMoVmnCF8zlKWvkB6ak3o0";

// ---------- ساخت خودکار فیلدهای فرم بر اساس FIELDS ----------
const form = document.getElementById('dataForm');

FIELDS.forEach(f => {
  const wrapper = document.createElement('div');
  wrapper.className = 'field';

  const label = document.createElement('label');
  label.setAttribute('for', f.id);
  label.textContent = f.label;
  wrapper.appendChild(label);

  const input = document.createElement('input');
  input.id = f.id;

  if (f.type === 'file') {
    input.type = 'file';
    input.accept = 'image/*,application/pdf';
    if (f.required) input.required = true;

    const hint = document.createElement('div');
    hint.className = 'file-hint';
    hint.textContent = 'فرمت مجاز: عکس یا PDF — حداکثر ' + MAX_FILE_SIZE_MB + ' مگابایت';

    const fileNameShown = document.createElement('div');
    fileNameShown.className = 'file-name';
    input.addEventListener('change', () => {
      fileNameShown.textContent = input.files[0] ? input.files[0].name : '';
    });

    wrapper.appendChild(input);
    wrapper.appendChild(hint);
    wrapper.appendChild(fileNameShown);
  } else {
    input.type = 'text';
    if (f.type === 'numeric') input.inputMode = 'numeric';
    if (f.required) input.required = true;
    if (f.placeholder) input.placeholder = f.placeholder;
    if (f.maxLength) input.maxLength = f.maxLength;
    if (f.pattern) input.pattern = f.pattern;
    wrapper.appendChild(input);
  }

  form.appendChild(wrapper);
});

const submitBtn = document.createElement('button');
submitBtn.type = 'submit';
submitBtn.id = 'submitBtn';
submitBtn.textContent = 'ثبت اطلاعات';
form.appendChild(submitBtn);

const msgDiv = document.createElement('div');
msgDiv.className = 'msg';
msgDiv.id = 'msg';
form.appendChild(msgDiv);

// یک فایل را به رشته‌ی Base64 تبدیل می‌کند
function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      // نتیجه به شکل "data:image/png;base64,AAAA..." است؛ فقط بخش بعد از کاما لازم است
      const base64 = reader.result.split(',')[1];
      resolve({
        filename: file.name,
        mimeType: file.type || 'application/octet-stream',
        base64: base64
      });
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

// ---------- ارسال فرم ----------
form.addEventListener('submit', async function(e) {
  e.preventDefault();

  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  msg.textContent = '';
  msg.className = 'msg';

  // بررسی حجم فایل‌ها قبل از هر کاری
  const maxBytes = MAX_FILE_SIZE_MB * 1024 * 1024;
  for (const f of FIELDS) {
    if (f.type === 'file') {
      const fileInput = document.getElementById(f.id);
      const file = fileInput.files[0];
      if (file && file.size > maxBytes) {
        msg.textContent = 'حجم فایل «' + f.label + '» بیشتر از ' + MAX_FILE_SIZE_MB + ' مگابایت است.';
        msg.className = 'msg error';
        return;
      }
    }
  }

  btn.disabled = true;
  btn.textContent = 'در حال ارسال...';

  const data = { token: SECRET_TOKEN };

  try {
    for (const f of FIELDS) {
      if (f.type === 'file') {
        const fileInput = document.getElementById(f.id);
        const file = fileInput.files[0];
        data[f.id] = file ? await readFileAsBase64(file) : null;
      } else {
        data[f.id] = document.getElementById(f.id).value.trim();
      }
    }
  } catch (err) {
    msg.textContent = 'خطا در خواندن فایل. لطفاً دوباره تلاش کنید.';
    msg.className = 'msg error';
    btn.disabled = false;
    btn.textContent = 'ثبت اطلاعات';
    return;
  }

  fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(result => {
    if (result.status === 'success') {
      msg.textContent = 'اطلاعات با موفقیت ثبت شد.';
      msg.className = 'msg success';
      form.reset();
    } else if (result.status === 'duplicate') {
      msg.textContent = result.message || 'این کد ملی قبلاً ثبت شده است.';
      msg.className = 'msg error';
    } else {
      msg.textContent = result.message || 'خطا در ثبت اطلاعات. لطفاً دوباره تلاش کنید.';
      msg.className = 'msg error';
    }
  })
  .catch(err => {
    msg.textContent = 'ارتباط با سرور برقرار نشد. لطفاً دوباره تلاش کنید.';
    msg.className = 'msg error';
    console.error(err);
  })
  .finally(() => {
    btn.disabled = false;
    btn.textContent = 'ثبت اطلاعات';
  });
});
</script>

</body>
</html>
